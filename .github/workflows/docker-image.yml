name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: southamerica-west1
  REPOSITORY: myrepostandar
  IMAGE_NAME: imagengerald
  TAG: ${{ github.sha }}

permissions:
  contents: 'read'
  id-token: 'write' # Necesario para Workload Identity Federation

jobs:
          
  build:

    runs-on: ubuntu-latest

    steps:
    
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Importante: obtiene el historial completo para comparar commits correctamente

    - name: Comprobar cambios en un directorio específico
      id: check_dir
      run: |
        if git diff --name-only HEAD~1 HEAD | grep -q "^.github/workflows"; then
          echo "any_changed=true" >> $GITHUB_OUTPUT
          echo "Se detectaron cambios en el directorio de pipelines, por lo tanto no se creara una nueva version de la imagen."
        else
          echo "any_changed=false" >> $GITHUB_OUTPUT
          echo "No hubo cambios en el directorio."
        fi
        
    - name: Funcion para autenticarse en GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Configurar Docker para Artifact Registry
      run: |-
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
        
    - name: Build the Docker image
      if: steps.check_dir.outputs.any_changed == 'false'
      run: |
        docker build --file Dockerfile \
        --tag imagengerald:latest \
        --tag "imagengerald:${{ env.TAG }}" \
        .

    - name: Crear variable con la imagen
      if: steps.check_dir.outputs.any_changed == 'false'
      run: |
        echo "FULL_IMAGE_NAME=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV
        
    - name: Crear directorio de imagen
      if: steps.check_dir.outputs.any_changed == 'false'
      run: |
        docker tag imagengerald:${{ env.TAG }} $FULL_IMAGE_NAME:${{ env.TAG }}
        docker tag imagengerald:latest $FULL_IMAGE_NAME:latest
        docker push $FULL_IMAGE_NAME:${{ env.TAG }}
        docker push $FULL_IMAGE_NAME:latest
      
    - name: Correr imagen Docker
      run: |
        IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
        docker pull $IMAGE_URI
        docker run --rm $IMAGE_URI
      continue-on-error: true
      
    - name: Aqua Security Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with: 
        image-ref: 'docker.io/library/imagengerald:${{ env.TAG }}'
        format: 'json'
        output: 'trivy-results.json'
        severity: 'CRITICAL,HIGH,MEDIUM'
      
    - name: Generate Github Summary
      if: always() # Asegura que se ejecute aunque Trivy encuentre vulnerabilidades
      run: |
          # Instalar jq para procesar el JSON si no está disponible
          sudo apt-get install -y jq

          # Leer totales usando jq (asumiendo formato estándar de Trivy)
          CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)
          MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json)

          # Crear el diseño del Summary en Markdown
          echo "## 🛡️ Reporte de Seguridad - Trivy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Resumen de vulnerabilidades encontradas en el escaneo:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Tabla de resumen
          echo "| Gravedad | Total | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Crítica | $CRITICAL | $( [ $CRITICAL -gt 0 ] && echo "❌ Acción Requerida" || echo "✅ Limpio" ) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 Alta | $HIGH | $( [ $HIGH -gt 0 ] && echo "⚠️ Revisar" || echo "✅ Limpio" ) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Media | $MEDIUM | 👀 Informativo |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Detalle de las vulnerabilidades Críticas (Top 5 de muestra)
          if [ $CRITICAL -gt 0 ]; then
            echo "### 🚨 Vulnerabilidades Críticas Detectadas:" >> $GITHUB_STEP_SUMMARY
            echo "| ID | Paquete | Versión Instalada | Versión Fija |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL") | "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "N/A") |"' trivy-results.json | head -n 5 >> $GITHUB_STEP_SUMMARY
          fi

  deploy:
  
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Aqua Security Trivy
        run: echo 'Hola Mundo'

      - name: Funcion para autenticarse en GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_GKE }}
          
      - name: Obtener credenciales de GKE
        if: github.event_name == 'push'
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_CLUSTER_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
  
      - name: Desplegar aplicación en GKE
        if: github.event_name == 'push' && success()
        shell: bash
        run: |
          set -euo pipefail
  
          # Si solo cambió el pipeline, reutilizar la última imagen.
          if [[ "${{ steps.check_dir.outputs.any_changed }}" == "true" ]]; then
            TAG_TO_DEPLOY="latest"
          else
            TAG_TO_DEPLOY="${{ env.TAG }}"
          fi
          
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${TAG_TO_DEPLOY}"
  
          echo "Imagen que se desplegará: $IMAGE_URI"
  
          # Aplicar el Deployment con la imagen seleccionada.
          sed "s|IMAGE_URI_PLACEHOLDER|${IMAGE_URI}|g" \
            k8s/deployment.yaml | kubectl apply -f -
  
          # Crear o actualizar el Service.
          kubectl apply -f k8s/service.yaml
  
          # Esperar a que Kubernetes complete el despliegue.
          kubectl rollout status deployment/imagengerald \
            --timeout=180s
  
          # Mostrar el estado del Deployment y el Service.
          kubectl get pods -l app=imagengerald
          kubectl get service imagengerald-service
  
          
      
